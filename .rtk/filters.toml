# Project-local RTK filters — commit this file with your repo.
# Filters here override user-global and built-in filters.
# Docs: https://github.com/rtk-ai/rtk#custom-filters
schema_version = 1

# --- Lucky Store project-specific filters ---

[filters.lucky-store-next-build]
description = "Compress Next.js build output for customer_storefront"
match_command = "next build"
strip_ansi = true
max_lines = 80
on_empty = "next build: ok"

[filters.lucky-store-tsc]
description = "Compress TypeScript noEmit output across monorepo"
match_command = "tsc --noEmit"
strip_ansi = true
max_lines = 60
on_empty = "tsc: no errors"

[filters.lucky-store-typecheck]
description = "Compress npm run typecheck output"
match_command = "npm run typecheck"
strip_ansi = true
max_lines = 60
on_empty = "typecheck: ok"

[filters.lucky-store-lint]
description = "Compress ESLint/Next lint output"
match_command = "(eslint|next lint|npm run lint)"
strip_ansi = true
max_lines = 60
on_empty = "lint: clean"

[filters.lucky-store-vite-build]
description = "Compress Vite production build output (admin_web)"
match_command = "vite build"
strip_ansi = true
max_lines = 80
on_empty = "vite build: ok"

[filters.lucky-store-admin-build]
description = "Compress admin_web npm run build output"
match_command = "npm run build"
path_contains = "apps/admin_web"
strip_ansi = true
max_lines = 100
on_empty = "admin_web build: ok"

[filters.lucky-store-vitest]
description = "Compress vitest output across monorepo"
match_command = "vitest"
strip_ansi = true
max_lines = 80
on_empty = "vitest: no failures"

[filters.lucky-store-gh-pr]
description = "Compress gh PR JSON output (already compact, avoid rtk proxy overhead)"
match_command = "gh pr (view|checks|list)"
strip_ansi = true
max_lines = 40
on_empty = "gh pr: ok"

[filters.lucky-store-gh-run]
description = "Compress gh run output"
match_command = "gh run (view|list)"
strip_ansi = true
max_lines = 40
on_empty = "gh run: ok"

[filters.lucky-store-git-push]
description = "Compress git push output"
match_command = "git push"
strip_ansi = true
max_lines = 10
on_empty = "push: ok"

[filters.lucky-store-git-add]
description = "Compress git add output"
match_command = "git add"
strip_ansi = true
max_lines = 5
on_empty = "add: ok"

[filters.lucky-store-ls]
description = "Compress ls -la output"
match_command = "ls -la"
strip_ansi = true
max_lines = 30
on_empty = "ls: ok"
