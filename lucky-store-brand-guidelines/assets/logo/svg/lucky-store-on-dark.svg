<?xml version="1.0" encoding="UTF-8"?>
<!-- Lucky Store 1947 — Approved Dark Inverse Variant (Dot-O Inline Aligned) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" width="440" height="360">
  <!-- Deep Night Dark Card Background -->
  <rect width="440" height="360" rx="36" fill="#0B0B0D" id="bg"/>

  <g id="logo-dark-inverse">
    <!-- LUCKY -->
    <text x="50" y="140"
          font-family="'Geist','Inter','Helvetica Neue',Arial,sans-serif"
          font-size="105"
          font-weight="900"
          fill="#FDFBF7"
          text-anchor="start"
          letter-spacing="-2"
          id="line-lucky">LUCKY</text>

    <!-- ST -->
    <text x="50" y="245"
          font-family="'Geist','Inter','Helvetica Neue',Arial,sans-serif"
          font-size="105"
          font-weight="900"
          fill="#FDFBF7"
          text-anchor="start"
          letter-spacing="-2"
          id="st-part">ST</text>

    <!-- SAFFRON YELLOW DOT (O - Inline aligned) -->
    <circle cx="211" cy="208" r="37" fill="#f0c444" id="dot-o"/>

    <!-- RE -->
    <text x="256" y="245"
          font-family="'Geist','Inter','Helvetica Neue',Arial,sans-serif"
          font-size="105"
          font-weight="900"
          fill="#FDFBF7"
          text-anchor="start"
          letter-spacing="-2"
          id="re-part">RE</text>

    <!-- YEAR: 1947 -->
    <text x="50" y="310"
          font-family="'Geist Mono','JetBrains Mono','SF Mono',monospace"
          font-size="26"
          font-weight="600"
          fill="#6B6B6B"
          text-anchor="start"
          letter-spacing="6"
          id="year">1947</text>
  </g>
</svg>
