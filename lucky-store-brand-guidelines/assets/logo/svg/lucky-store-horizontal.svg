<?xml version="1.0" encoding="UTF-8"?>
<!-- Lucky Store 1947 — Approved Horizontal Header Wordmark (LUCKY STORE ● 1947) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 80" width="540" height="80">
  <g id="logo-horizontal">
    <!-- LUCKY STORE -->
    <text x="10" y="56"
          font-family="'Geist','Inter','Helvetica Neue',Arial,sans-serif"
          font-size="52"
          font-weight="900"
          fill="#0B0B0D"
          letter-spacing="-1.5"
          id="wordmark">LUCKY STORE</text>

    <!-- SAFFRON YELLOW DOT -->
    <circle cx="395" cy="42" r="14" fill="#f0c444" id="dot"/>

    <!-- YEAR: 1947 -->
    <text x="428" y="55"
          font-family="'Geist Mono','JetBrains Mono','SF Mono',monospace"
          font-size="28"
          font-weight="600"
          fill="#6B6B6B"
          letter-spacing="4"
          id="year">1947</text>
  </g>
</svg>
