<?xml version="1.0" encoding="UTF-8"?>
<!-- Lucky Store — App Icon / Favicon Mark (512×512, optimized for small sizes) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Deep Night Rounded Square Background -->
  <rect width="512" height="512" rx="112" fill="#0B0B0D" id="bg"/>

  <!-- Bold "L" Letterform -->
  <text x="100" y="370"
        font-family="'Geist','Inter','Helvetica Neue',Arial,sans-serif"
        font-size="380"
        font-weight="900"
        fill="#FDFBF7"
        text-anchor="start"
        letter-spacing="-8"
        id="letter-L">L</text>

  <!-- Saffron Brand Dot (top-right accent) -->
  <circle cx="370" cy="140" r="68" fill="#f0c444" id="brand-dot"/>
</svg>