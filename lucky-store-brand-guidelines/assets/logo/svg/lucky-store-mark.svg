<?xml version="1.0" encoding="UTF-8"?>
<!-- Lucky Store 1947 — Approved Mark / App Icon (Tight Kerned STORE inside Rounded Saffron Card) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Saffron Card Background -->
  <rect width="512" height="512" rx="64" fill="#f0c444" id="bg"/>

  <g id="logo-mark">
    <!-- LUCKY -->
    <text x="60" y="180"
          font-family="'Geist','Inter','Helvetica Neue',Arial,sans-serif"
          font-size="120"
          font-weight="900"
          fill="#0B0B0D"
          text-anchor="start"
          letter-spacing="-2"
          id="line-lucky">LUCKY</text>

    <!-- ST -->
    <text x="60" y="300"
          font-family="'Geist','Inter','Helvetica Neue',Arial,sans-serif"
          font-size="120"
          font-weight="900"
          fill="#0B0B0D"
          text-anchor="start"
          letter-spacing="-4"
          id="st-part">ST</text>

    <!-- SOLID BLACK DOT (O) -->
    <circle cx="236" cy="254" r="46" fill="#0B0B0D" id="dot-o"/>

    <!-- RE -->
    <text x="278" y="300"
          font-family="'Geist','Inter','Helvetica Neue',Arial,sans-serif"
          font-size="120"
          font-weight="900"
          fill="#0B0B0D"
          text-anchor="start"
          letter-spacing="-2"
          id="re-part">RE</text>

    <!-- YEAR: 1947 (Left-aligned under ST) -->
    <text x="60" y="380"
          font-family="'Geist Mono','JetBrains Mono','SF Mono',monospace"
          font-size="32"
          font-weight="600"
          fill="#3D382B"
          text-anchor="start"
          letter-spacing="8"
          id="year">1947</text>
  </g>
</svg>