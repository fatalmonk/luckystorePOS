<?xml version="1.0" encoding="UTF-8"?>
<!-- Lucky Store 1947 — On Saffron Yellow (Saffron #f0c444 background with Deep Night #0B0B0D text) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440">
  <!-- Saffron Background -->
  <rect width="400" height="440" fill="#f0c444" rx="0" id="bg"/>

  <g id="logo-wordmark">
    <!-- LUCKY -->
    <text x="200" y="150"
          font-family="'Geist','Inter','Helvetica Neue',Arial,sans-serif"
          font-size="115"
          font-weight="900"
          fill="#0B0B0D"
          text-anchor="middle"
          letter-spacing="-2"
          id="line-lucky">LUCKY</text>

    <!-- ST -->
    <text x="145" y="270"
          font-family="'Geist','Inter','Helvetica Neue',Arial,sans-serif"
          font-size="115"
          font-weight="900"
          fill="#0B0B0D"
          text-anchor="end"
          letter-spacing="-2"
          id="st-part">ST</text>

    <!-- DEEP NIGHT DOT (O) -->
    <circle cx="200" cy="236" r="33" fill="#0B0B0D" id="dot-o"/>

    <!-- RE -->
    <text x="255" y="270"
          font-family="'Geist','Inter','Helvetica Neue',Arial,sans-serif"
          font-size="115"
          font-weight="900"
          fill="#0B0B0D"
          text-anchor="start"
          letter-spacing="-2"
          id="re-part">RE</text>

    <!-- YEAR: 1947 -->
    <text x="200" y="340"
          font-family="'Geist Mono','JetBrains Mono','SF Mono',monospace"
          font-size="28"
          font-weight="600"
          fill="rgba(11, 11, 13, 0.7)"
          text-anchor="middle"
          letter-spacing="10"
          id="year">1947</text>
  </g>
</svg>
