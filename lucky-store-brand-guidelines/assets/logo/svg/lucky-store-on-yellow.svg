<?xml version="1.0" encoding="UTF-8"?>
<!-- Lucky Store 1947 — Approved On Saffron Variant (Yellow Card with Solid Black Dot-O and Left-Aligned 1947) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 410" width="460" height="410">
  <!-- Saffron Card Background -->
  <rect width="460" height="410" rx="36" fill="#f0c444" id="bg"/>

  <g id="logo-on-saffron">
    <!-- LUCKY -->
    <text x="50" y="140"
          font-family="'Geist','Inter','Helvetica Neue',Arial,sans-serif"
          font-size="105"
          font-weight="900"
          fill="#0B0B0D"
          text-anchor="start"
          letter-spacing="-2"
          id="line-lucky">LUCKY</text>

    <!-- ST -->
    <text x="50" y="245"
          font-family="'Geist','Inter','Helvetica Neue',Arial,sans-serif"
          font-size="105"
          font-weight="900"
          fill="#0B0B0D"
          text-anchor="start"
          letter-spacing="-2"
          id="st-part">ST</text>

    <!-- SOLID BLACK DOT (O) -->
    <circle cx="222" cy="214" r="32" fill="#0B0B0D" id="dot-o"/>

    <!-- RE -->
    <text x="267" y="245"
          font-family="'Geist','Inter','Helvetica Neue',Arial,sans-serif"
          font-size="105"
          font-weight="900"
          fill="#0B0B0D"
          text-anchor="start"
          letter-spacing="-2"
          id="re-part">RE</text>

    <!-- YEAR: 1947 -->
    <text x="50" y="310"
          font-family="'Geist Mono','JetBrains Mono','SF Mono',monospace"
          font-size="26"
          font-weight="600"
          fill="#3D382B"
          text-anchor="start"
          letter-spacing="6"
          id="year">1947</text>

    <!-- VARIANT LABEL -->
    <text x="50" y="360"
          font-family="'Geist Mono','JetBrains Mono','SF Mono',monospace"
          font-size="20"
          font-weight="500"
          fill="#5C5440"
          text-anchor="start"
          letter-spacing="4"
          id="label">ON SAFFRON VARIANT</text>
  </g>
</svg>
