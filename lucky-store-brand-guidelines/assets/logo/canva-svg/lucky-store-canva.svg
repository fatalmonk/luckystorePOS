<?xml version="1.0" encoding="UTF-8"?>
<!-- Lucky Store 1947 — Canva-Ready Approved Logo (Tight Kerned STORE Matching LUCKY Width) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 330" width="410" height="330">
  <g id="logo-canva">
    <!-- LUCKY -->
    <text x="35" y="115"
          font-family="sans-serif"
          font-size="110"
          font-weight="900"
          fill="#0B0B0D"
          text-anchor="start"
          letter-spacing="-2"
          id="line-lucky">LUCKY</text>

    <!-- ST -->
    <text x="35" y="225"
          font-family="sans-serif"
          font-size="110"
          font-weight="900"
          fill="#0B0B0D"
          text-anchor="start"
          letter-spacing="-2"
          id="st-part">ST</text>

    <!-- SAFFRON YELLOW DOT (O - Tight Kerned) -->
    <circle cx="196" cy="186" r="41" fill="#f0c444" id="dot-o"/>

    <!-- RE -->
    <text x="241" y="225"
          font-family="sans-serif"
          font-size="110"
          font-weight="900"
          fill="#0B0B0D"
          text-anchor="start"
          letter-spacing="-2"
          id="re-part">RE</text>

    <!-- YEAR: 1947 (Left-aligned under ST) -->
    <text x="35" y="295"
          font-family="monospace"
          font-size="28"
          font-weight="600"
          fill="#6B6B6B"
          text-anchor="start"
          letter-spacing="6"
          id="year">1947</text>
  </g>
</svg>