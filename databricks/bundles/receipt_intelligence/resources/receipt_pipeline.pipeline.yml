resources:
  pipelines:
    receipt_intelligence_pipeline:
      name: "${bundle.target}-luckystore-receipt-pipeline"
      catalog: ${var.catalog}
      target: ${var.schema}
      serverless: true
      continuous: false
      photon: true
      channel: current
      libraries:
        - glob:
            include: ../src/pipelines/receipt_pipeline/**
      configuration:
        bundle.target: ${bundle.target}
        target_catalog: ${var.catalog}
        target_schema: ${var.schema}
        landing_volume_path: "/Volumes/${var.catalog}/${var.schema}/receipts_landing/"
