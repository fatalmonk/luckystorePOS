name: Monitor robots.txt
on:
  workflow_dispatch:
  # NOTE: Hourly cron monitoring has been offloaded to Cloudflare Worker
  # (agent-luckystore1947 cron: '0 * * * *') to conserve GitHub Actions minutes.

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-save
      - run: node scripts/infra/monitor-robots.js
      - uses: actions/upload-artifact@v4
        with:
          name: robots-log
          path: scripts/infra/robots.log
