name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  admin_web_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: |
          cd apps/admin_web
          npx tsc -p tsconfig.app.json --noEmit
      - name: Lint
        run: |
          cd apps/admin_web
          npm run lint
      - name: Production build
        run: |
          cd apps/admin_web
          npm run build

  flutter_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
      - name: Debug Flutter version
        run: flutter --version
      - name: Install dependencies
        run: |
          cd apps/mobile_app
          flutter pub get -v
      - name: Run tests
        run: |
          cd apps/mobile_app
          flutter test --coverage
      - name: Run performance benchmark
        run: |
          cd apps/mobile_app
          flutter test test/performance/inventory_search.dart --reporter=compact

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
      - name: Debug Flutter version
        run: flutter --version
      - name: Install Flutter packages for linting
        run: |
          cd apps/mobile_app
          flutter pub get -v
      - name: Run analyzer
        run: |
          cd apps/mobile_app
          flutter analyze

  secret_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Secret scan self-test
        run: node scripts/security/secret_scan.js --self-test
      - name: Run Secret Scan
        run: node scripts/security/secret_scan.js
