name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.idea/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.idea/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  product_image_guard:
    name: Product image manifest and Git guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test image library metadata rules
        run: python3 -m unittest scripts.catalog.test_product_image_library
      - name: Reject tracked product packshots
        run: python3 scripts/catalog/check_no_tracked_product_images.py

  admin_web_check:
    needs: secret_scan
    if: ${{ always() && needs.secret_scan.outputs.admin_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: |
          cd apps/admin_web
          npx tsc -p tsconfig.app.json --noEmit
      - name: Lint
        run: |
          cd apps/admin_web
          npm run lint
      - name: Unit tests
        run: |
          cd apps/admin_web
          npx vitest run
      - name: Production build
        run: |
          cd apps/admin_web
          npm run build

  flutter_test:
    needs: secret_scan
    if: ${{ always() && needs.secret_scan.outputs.mobile_changed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      mobile_changed: ${{ steps.mobile_changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect mobile changes for APK packaging
        id: mobile_changes
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- apps/mobile_app/ .github/workflows/flutter-ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Debug Flutter version
        run: flutter --version
      - name: Install dependencies
        run: |
          cd apps/mobile_app
          flutter pub get
      - name: Run tests
        run: |
          cd apps/mobile_app
          flutter test --coverage
      - name: Run performance benchmark
        run: |
          cd apps/mobile_app
          flutter test test/performance/inventory_search.dart --reporter=compact

  lint:
    needs: secret_scan
    if: ${{ always() && needs.secret_scan.outputs.mobile_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          cache: true
      - name: Debug Flutter version
        run: flutter --version
      - name: Install Flutter packages for linting
        run: |
          cd apps/mobile_app
          flutter pub get
      - name: Run analyzer
        run: |
          cd apps/mobile_app
          flutter analyze

  secret_scan:
    outputs:
      admin_changed: ${{ steps.detect_mobile_changes.outputs.admin_changed }}
      mobile_changed: ${{ steps.detect_mobile_changes.outputs.changed }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Flutter app changes
        id: detect_mobile_changes
        uses: actions/github-script@v8
        with:
          script: |
            const mobilePath = /^(apps\/mobile_app\/|\.github\/workflows\/(ci|flutter-ci)\.yml$)/;
            const adminSkipPath = /^apps\/(mobile_app|customer_mobile|customer_storefront|scraper)\//;
            try {
              let changedFiles = [];

              if (context.eventName === 'pull_request') {
                if ((context.payload.pull_request?.changed_files ?? 0) >= 3000) {
                  core.warning('Pull request file list may be truncated; running Flutter checks.');
                  core.setOutput('changed', 'true');
                  core.setOutput('admin_changed', 'true');
                  return;
                }
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  per_page: 100,
                });
                changedFiles = files.map(file => file.filename);
              } else if (context.eventName === 'push') {
                const commits = context.payload.commits ?? [];
                if (commits.length === 0 || commits.length >= 2048 || commits.some(commit =>
                  (commit.added?.length ?? 0) +
                  (commit.modified?.length ?? 0) +
                  (commit.removed?.length ?? 0) >= 300
                )) {
                  core.warning('Push file list may be incomplete; running Flutter checks.');
                  core.setOutput('changed', 'true');
                  core.setOutput('admin_changed', 'true');
                  return;
                }
                changedFiles = commits.flatMap(commit => [
                  ...(commit.added ?? []),
                  ...(commit.modified ?? []),
                  ...(commit.removed ?? []),
                ]);
              } else {
                core.setOutput('changed', 'true');
                core.setOutput('admin_changed', 'true');
                return;
              }

              const changed = changedFiles.some(path => mobilePath.test(path));
              const adminChanged = changedFiles.length === 0 || changedFiles.some(path => !adminSkipPath.test(path));
              core.notice(changed
                ? 'Flutter files changed; running Flutter checks.'
                : 'No Flutter files changed; skipping Flutter checks.');
              core.setOutput('changed', String(changed));
              core.notice(adminChanged
                ? 'Admin or shared files changed; running admin checks.'
                : 'Only independent app files changed; skipping admin checks.');
              core.setOutput('admin_changed', String(adminChanged));
            } catch (error) {
              core.warning(`Could not determine changed files; running all checks. ${error.message}`);
              core.setOutput('changed', 'true');
              core.setOutput('admin_changed', 'true');
            }
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Secret scan self-test
        run: node scripts/security/secret_scan.js --self-test
      - name: Run Secret Scan
        run: node scripts/security/secret_scan.js

  build_android:
    name: Android packaging
    needs: [flutter_test, lint]
    if: github.event_name == 'push' && needs.flutter_test.outputs.mobile_changed == 'true'
    uses: ./.github/workflows/flutter-ci.yml
    permissions:
      contents: write
