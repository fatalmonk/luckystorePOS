name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.idea/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.idea/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  admin_web_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: |
          cd apps/admin_web
          npx tsc -p tsconfig.app.json --noEmit
      - name: Lint
        run: |
          cd apps/admin_web
          npm run lint
      - name: Unit tests
        run: |
          cd apps/admin_web
          npx vitest run
      - name: Production build
        run: |
          cd apps/admin_web
          npm run build

  flutter_test:
    runs-on: ubuntu-latest
    outputs:
      mobile_changed: ${{ steps.mobile_changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect mobile changes for APK packaging
        id: mobile_changes
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- apps/mobile_app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Debug Flutter version
        run: flutter --version
      - name: Install dependencies
        run: |
          cd apps/mobile_app
          flutter pub get
      - name: Run tests
        run: |
          cd apps/mobile_app
          flutter test --coverage
      - name: Run performance benchmark
        run: |
          cd apps/mobile_app
          flutter test test/performance/inventory_search.dart --reporter=compact

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          cache: true
      - name: Debug Flutter version
        run: flutter --version
      - name: Install Flutter packages for linting
        run: |
          cd apps/mobile_app
          flutter pub get
      - name: Run analyzer
        run: |
          cd apps/mobile_app
          flutter analyze

  secret_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Secret scan self-test
        run: node scripts/security/secret_scan.js --self-test
      - name: Run Secret Scan
        run: node scripts/security/secret_scan.js

  build_android:
    name: Android packaging
    needs: [flutter_test, lint]
    if: github.event_name == 'push' && needs.flutter_test.outputs.mobile_changed == 'true'
    uses: ./.github/workflows/flutter-ci.yml
    permissions:
      contents: write
