name: Playwright Tests
on:
  # Storefront CI/CD is the maintained Playwright gate for this monorepo.
  # Keep this legacy root workflow manual so it cannot load Vitest files as
  # Playwright tests during pull requests.
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run storefront Playwright tests
      run: cd apps/customer_storefront && npx playwright test --project=chromium
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
