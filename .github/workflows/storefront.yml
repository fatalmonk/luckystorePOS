name: Storefront CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/customer_storefront/**'
      - 'supabase/migrations/**'
      - 'scripts/ci/**'
      - 'supabase/seed/**'
      - '.github/workflows/storefront.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/customer_storefront/**'
      - 'supabase/migrations/**'
      - 'scripts/ci/**'
      - 'supabase/seed/**'
      - '.github/workflows/storefront.yml'

concurrency:
  # The E2E job mutates one shared test project; serialize all runs globally.
  group: ${{ github.workflow }}-test-supabase
  cancel-in-progress: false

jobs:
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint --workspace=customer_storefront
      - run: cd apps/customer_storefront && npx tsc --noEmit

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    env:
      CI: true
      HAS_SUPABASE_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
      NEXT_PUBLIC_IMAGE_BASE_URL: 'http://localhost:3000'
    steps:
      - uses: actions/checkout@v4

      - name: Configure Test Supabase Environment
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.TEST_SUPABASE_URL }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.TEST_SUPABASE_ANON_KEY }}" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}" >> $GITHUB_ENV
          echo "E2E_SUPABASE_PROJECT_REF=grxxenvdhfwzafzyykgo" >> $GITHUB_ENV
          echo "E2E_CAN_MUTATE=true" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Seed Test Supabase Catalog
        run: node scripts/ci/seed_test_storefront.js

      - name: Preflight Test Supabase Environment
        run: node scripts/ci/preflight_test_env.js

      - name: Prepare deterministic banner fixtures
        working-directory: apps/customer_storefront
        run: |
          node <<'NODE'
          const fs = require('node:fs/promises');
          const path = require('node:path');

          const banners = [
            'promo_welcome_v2', 'promo_buldak', 'promo_dairy',
            'promo_tea_coffee', 'hero_grocery_banner', 'native_ad_banner'
          ];
          const widths = [400, 600, 800, 1200];
          const outputDir = 'public/banners';
          const dummyWebp = Buffer.from('UklGRiQAAABXRUJQVlA4IBgAAAAwAQCdASoBAAEAAQAcJaQAA3AA/v3AgAA=', 'base64');
          const dummyAvif = Buffer.from('AAAAIGZ0eXBhdmlmAAAAAGF2aWZtaWYxTUlBMDFNQTBMAAAADG1ldGEAAAAAAAAAIWhkbHJfAAAAZGF0YQAAAAAAAAAAAAAAAAAAAAAA', 'base64');

          async function generateFixtures() {
            await fs.mkdir(outputDir, { recursive: true });
            await Promise.all(banners.flatMap((name) =>
              widths.flatMap((width) => [
                fs.writeFile(path.join(outputDir, `${name}_${width}.avif`), dummyAvif),
                fs.writeFile(path.join(outputDir, `${name}_${width}.webp`), dummyWebp),
              ])
            ));
          }

          generateFixtures().catch((err) => {
            console.error(err);
            process.exitCode = 1;
          });
          NODE

      - name: Cache Next.js build artifacts
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/apps/customer_storefront/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/customer_storefront/**/*.ts', 'apps/customer_storefront/**/*.tsx', 'apps/customer_storefront/**/*.js', 'apps/customer_storefront/**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - run: npm run build --workspace=customer_storefront

      - name: Prepare standalone static assets
        working-directory: apps/customer_storefront
        run: |
          cp -r public .next/standalone/apps/customer_storefront/public
          cp -r .next/static .next/standalone/apps/customer_storefront/.next/static

      - run: npx playwright install chromium
      - run: cd apps/customer_storefront && npx playwright test --project=chromium
