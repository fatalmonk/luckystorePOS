name: Storefront CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/customer_storefront/**'
      - 'supabase/migrations/**'
      - '.github/workflows/storefront.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/customer_storefront/**'
      - 'supabase/migrations/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint --workspace=customer_storefront

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: cd apps/customer_storefront && npx tsc --noEmit

  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      CI: true
      HAS_SUPABASE_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
      # Keep browser tests deterministic and independent of external CDN availability.
      NEXT_PUBLIC_IMAGE_BASE_URL: 'http://localhost:3000'
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch Supabase Preview Branch
        if: env.HAS_SUPABASE_TOKEN == 'true'
        id: supabase_preview
        uses: 0xbigboss/supabase-branch-gh-action@v1
        with:
          supabase-access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          supabase-project-id: 'hvmyxyccfnkrbxqbhlnm'

      - name: Set environment variables for preview branch
        run: |
          if [ -n "${{ steps.supabase_preview.outputs.api_url }}" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ steps.supabase_preview.outputs.api_url }}" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ steps.supabase_preview.outputs.anon_key }}" >> $GITHUB_ENV
            echo "SUPABASE_SERVICE_ROLE_KEY"="${{ steps.supabase_preview.outputs.service_role_key }}" >> $GITHUB_ENV
          else
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> $GITHUB_ENV
            echo "SUPABASE_SERVICE_ROLE_KEY"="${{ secrets.SUPABASE_SERVICE_KEY }}" >> $GITHUB_ENV
          fi
      
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Prepare deterministic banner fixtures
        working-directory: apps/customer_storefront
        run: |
          node <<'NODE'
          const fs = require('node:fs/promises');
          const path = require('node:path');
          const sharp = require('sharp');

          const banners = {
            promo_welcome_v2: 'public/images/hero_grocery_banner_1200.webp',
            promo_buldak: 'public/images/promo_spices.webp',
            promo_dairy: 'public/images/promo_dairy.webp',
            promo_tea_coffee: 'public/images/promo_tea_coffee.webp',
            hero_grocery_banner: 'public/images/hero_grocery_banner_1200.webp',
            native_ad_banner: 'public/images/native_ad_banner_1200.webp',
          };
          const widths = [400, 600, 800, 1200];
          const outputDirectory = 'public/banners';

          async function generateFixtures() {
            await fs.mkdir(outputDirectory, { recursive: true });
            await Promise.all(Object.entries(banners).flatMap(([name, input]) =>
              widths.flatMap((width) => {
                const height = Math.round(width * 9 / 16);
                const image = sharp(input).resize(width, height, { fit: 'cover' });
                return [
                  image.clone().avif({ quality: 70 }).toFile(path.join(outputDirectory, `${name}_${width}.avif`)),
                  image.clone().webp({ quality: 78 }).toFile(path.join(outputDirectory, `${name}_${width}.webp`)),
                ];
              })
            ));
          }

          generateFixtures().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - run: npx playwright install --with-deps
      - run: npm run build --workspace=customer_storefront
      - run: cd apps/customer_storefront && npx playwright test --project=chromium
