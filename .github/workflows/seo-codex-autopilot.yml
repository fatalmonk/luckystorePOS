name: Lucky Store SEO Codex Autopilot

on:
  workflow_run:
    workflows: ['Lucky Store Technical SEO Monitor']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      audit_run_id:
        description: 'Completed current-main audit run ID; blank selects latest successful main audit'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: seo-codex-autopilot-main
  cancel-in-progress: false

jobs:
  gsc:
    if: >-
      github.repository == 'fatalmonk/luckystorePOS' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: seo-autopilot
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Search Console collector
        run: python3 -m unittest discover -s scripts/seo -p 'test_gsc_snapshot.py' -v
      - name: Capture read-only Search Console evidence
        id: gsc_capture
        continue-on-error: true
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'sc-domain:luckystore1947.com' }}
        run: |
          GSC_SITE_URL="${GSC_SITE_URL:-sc-domain:luckystore1947.com}"
          export GSC_SITE_URL
          if [ -z "$GSC_CLIENT_ID" ] || [ -z "$GSC_CLIENT_SECRET" ] || [ -z "$GSC_REFRESH_TOKEN" ] || [ -z "$GSC_SITE_URL" ]; then
            echo "Search Console credentials missing; recording status as unavailable."
            echo '{"status": "unavailable", "reason": "Missing GSC credentials or site URL"}' > /tmp/gsc-input.json
          elif ! python3 scripts/seo/gsc_snapshot.py --output /tmp/gsc-input.json; then
            echo "Search Console capture failed; recording status as unavailable."
            echo '{"status": "unavailable", "reason": "Search Console API capture failed"}' > /tmp/gsc-input.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-gsc-evidence
          path: /tmp/gsc-input.json
          if-no-files-found: ignore
          retention-days: 1

  propose:
    needs: gsc
    if: >-
      always() &&
      github.repository == 'fatalmonk/luckystorePOS' && github.ref == 'refs/heads/main' &&
      needs.gsc.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: seo-autopilot
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      changed: ${{ steps.guard.outputs.changed }}
      overlap: ${{ steps.existing_pr.outputs.skip }}
      audit: ${{ steps.audit.outcome }}
      codex: ${{ steps.codex.outcome }}
      guard: ${{ steps.guard.outcome }}
    steps:
      - name: Checkout audited commit without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: 'Preflight: audited commit matches checked-out main'
        env:
          EVENT_NAME: ${{ github.event_name }}
          AUDIT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BASE_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_run ] && [ "$AUDIT_HEAD_SHA" != "$BASE_SHA" ]; then
            echo '::error::Audit commit differs from the automation base commit.'
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: 'Preflight: configured API key'
        env:
          CODEX_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$CODEX_KEY" ]; then
            echo "::error::Missing OPENROUTER_API_KEY. Configure the seo-autopilot environment secret."
            exit 1
          fi

      - name: 'Preflight: reject overlapping autopilot PR'
        id: existing_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --base main --state open --json headRefName,labels --jq '[.[] | select((.headRefName | startswith("seo/")) or ([.labels[].name] | index("seo")))] | length')
          if [ "$count" -gt 0 ]; then
            echo "An existing SEO PR awaits review; do not overwrite it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate exact fresh audit evidence
        id: audit
        if: steps.existing_pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RUN_ID: ${{ github.event.workflow_run.id || inputs.audit_run_id }}
          BASE_SHA: ${{ github.sha }}
        run: |
          mkdir -p /tmp/seo-autopilot-evidence
          python3 scripts/seo/audit_input.py --run-id "$AUDIT_RUN_ID" --base "$BASE_SHA" --output seo/autopilot-input.json

      - name: Download credential-free Search Console evidence
        if: steps.existing_pr.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: seo-gsc-evidence
          path: seo/

      - name: Run Codex in restricted workspace
        id: codex
        if: steps.existing_pr.outputs.skip != 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          responses-api-endpoint: https://openrouter.ai/api/v1/responses
          model: ${{ vars.OPENROUTER_CODEX_MODEL || 'openai/gpt-5.6-luna' }}
          effort: medium
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          allow-bots: true
          prompt-file: seo/codex-daily-prompt.md
          output-file: /tmp/seo-autopilot-evidence/codex-summary.txt

      - name: Reject unsafe or unsupported changes
        if: steps.existing_pr.outputs.skip != 'true'
        id: guard
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          rm -f seo/autopilot-input.json seo/gsc-input.json
          git show "$BASE_SHA:scripts/seo/validate_autopilot_changes.py" > /tmp/seo-guard.py
          python3 -I /tmp/seo-guard.py --base "$BASE_SHA"
          if [ -n "$(git status --porcelain)" ]; then
            git add -- seo/ apps/customer_storefront/app/
            git diff --cached --no-ext-diff --no-textconv --binary "$BASE_SHA" > /tmp/seo-autopilot-evidence/proposal.patch
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.changed == 'true'
        with:
          name: seo-proposal
          path: /tmp/seo-autopilot-evidence/proposal.patch
          if-no-files-found: error
          retention-days: 7

  evidence:
    needs: propose
    if: needs.propose.result == 'success' && needs.propose.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: seo-autopilot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Capture published content on trusted runner
        env:
          NOTFAIR_SEO_API_KEY: ${{ secrets.NOTFAIR_SEO_API_KEY }}
        run: python3 scripts/seo/notfair_snapshot.py --output /tmp/notfair-snapshot.json
      - uses: actions/upload-artifact@v4
        with:
          name: seo-content-snapshot
          path: /tmp/notfair-snapshot.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@v4
        with:
          name: seo-proposal
          path: /tmp/seo-proposal
      - name: Independently validate proposal without executing it
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          test "$(wc -c < /tmp/seo-proposal/proposal.patch)" -le 131072
          cp -R scripts/seo "$RUNNER_TEMP/seo-trusted"
          python3 "$RUNNER_TEMP/seo-trusted/validate_autopilot_changes.py" --patch /tmp/seo-proposal/proposal.patch
          git apply --index /tmp/seo-proposal/proposal.patch
          python3 "$RUNNER_TEMP/seo-trusted/validate_autopilot_changes.py" --base "$BASE_SHA"
      - name: Jev advisory review through OpenRouter
        env:
          BASE_SHA: ${{ github.sha }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 "$RUNNER_TEMP/seo-trusted/jev_review.py" --base "$BASE_SHA" --output /tmp/jev-review.json --markdown /tmp/jev-review.md
          cat /tmp/jev-review.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: seo-jev-review
          path: /tmp/jev-review.*
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: [propose, evidence]
    if: needs.propose.result == 'success' && needs.evidence.result == 'success' && needs.propose.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No environment or injected API credentials on the execution runner.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: seo-proposal
          path: /tmp/seo-proposal
      - uses: actions/download-artifact@v4
        with:
          name: seo-content-snapshot
          path: /tmp/seo-inputs
      - name: Independently validate proposal
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          test "$(wc -c < /tmp/seo-proposal/proposal.patch)" -le 131072
          cp -R scripts/seo "$RUNNER_TEMP/seo-trusted"
          python3 "$RUNNER_TEMP/seo-trusted/validate_autopilot_changes.py" --patch /tmp/seo-proposal/proposal.patch
          git apply --index /tmp/seo-proposal/proposal.patch
          python3 "$RUNNER_TEMP/seo-trusted/validate_autopilot_changes.py" --base "$BASE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify storefront using credential-free build inputs
        env:
          BASE_SHA: ${{ github.sha }}
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: https://127.0.0.1:9443
          NEXT_PUBLIC_SUPABASE_ANON_KEY: seo-verification-fixture
          NOTFAIR_SEO_API_URL: https://127.0.0.1:9443/api/seo/content
          NOTFAIR_SEO_API_KEY: seo-verification-fixture
          NODE_EXTRA_CA_CERTS: /tmp/seo-inputs/cert.pem
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/seo-inputs/key.pem -out /tmp/seo-inputs/cert.pem -days 1 -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1' 2>/dev/null
          python3 "$RUNNER_TEMP/seo-trusted/snapshot_server.py" --snapshot /tmp/seo-inputs/notfair-snapshot.json --cert /tmp/seo-inputs/cert.pem --key /tmp/seo-inputs/key.pem > /tmp/seo-inputs/server.log 2>&1 &
          snapshot_pid=$!
          trap 'kill "$snapshot_pid" "${next_pid:-}" 2>/dev/null || true' EXIT
          cd apps/customer_storefront
          npm ci --ignore-scripts
          npx --no-install eslint .
          npm run typecheck
          npm run test -- --run
          npm run build
          npm run start -- --hostname 127.0.0.1 > /tmp/seo-inputs/next.log 2>&1 &
          next_pid=$!
          cd ../..
          python3 "$RUNNER_TEMP/seo-trusted/wait_for_storefront.py"
          python3 "$RUNNER_TEMP/seo-trusted/rendered_review.py" --base "$BASE_SHA" --output /tmp/seo-inputs/rendered-review.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-rendered-review
          path: /tmp/seo-inputs/rendered-review.json
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: [propose, evidence, verify]
    if: needs.propose.result == 'success' && needs.evidence.result == 'success' && needs.verify.result == 'success' && needs.propose.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_url: ${{ steps.pr.outputs.pull-request-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false
      - name: Reject stale base or overlapping proposal
        env:
          BASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          count=$(gh pr list --base main --state open --json headRefName,labels --jq '[.[] | select((.headRefName | startswith("seo/")) or ([.labels[].name] | index("seo")))] | length')
          test "$count" -eq 0
      - uses: actions/download-artifact@v4
        with:
          name: seo-proposal
          path: /tmp/seo-proposal
      - uses: actions/download-artifact@v4
        with:
          name: seo-jev-review
          path: /tmp/seo-review
      - name: Revalidate exact proposal and prepare review body
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          test "$(wc -c < /tmp/seo-proposal/proposal.patch)" -le 131072
          cp -R scripts/seo "$RUNNER_TEMP/seo-trusted"
          python3 "$RUNNER_TEMP/seo-trusted/validate_autopilot_changes.py" --patch /tmp/seo-proposal/proposal.patch
          git apply --index /tmp/seo-proposal/proposal.patch
          python3 "$RUNNER_TEMP/seo-trusted/validate_autopilot_changes.py" --base "$BASE_SHA"
          cp /tmp/seo-review/jev-review.md /tmp/seo-pr-body.md
          printf '\nChecks: deterministic diff policy, ESLint, typecheck, tests, production build and rendered SEO checks.\n\nBuild used published NotFair snapshots and local catalog fixtures. Production data, indexing and dynamic-route coverage remain unverified.\n\nNo automatic merge or deployment. PRs created with GITHUB_TOKEN may not trigger other PR workflows.\n' >> /tmp/seo-pr-body.md
      - name: Create draft review PR (never merge)
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          branch: seo/codex-autopilot
          base: main
          delete-branch: false
          draft: true
          commit-message: 'seo(autopilot): propose verified daily improvement'
          title: 'seo(autopilot): Codex daily verified improvement'
          body-path: /tmp/seo-pr-body.md
          add-paths: |
            seo/**
            apps/customer_storefront/app/**
      - name: Report result
        if: always()
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          echo "## SEO Codex daily proposal" >> "$GITHUB_STEP_SUMMARY"
          echo "PR: ${PR_URL:-No PR created}" >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Report every SEO run
    needs: [gsc, propose, evidence, verify, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Search Console evidence for report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: seo-gsc-evidence
          path: /tmp/seo-report-inputs
      - name: Write outcome report and workflow summary
        env:
          SEO_JOB_RESULTS: ${{ toJSON(needs) }}
          SEO_RUN_ID: ${{ github.run_id }}
          SEO_RUN_ATTEMPT: ${{ github.run_attempt }}
          SEO_BASE_SHA: ${{ github.sha }}
          GSC_SNAPSHOT_PATH: /tmp/seo-report-inputs/gsc-input.json
        run: python3 scripts/seo/run_report.py --output /tmp/seo-run-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-run-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/seo-run-report/
          if-no-files-found: error
          retention-days: 7
