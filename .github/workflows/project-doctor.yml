name: Project Doctor

on:
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.idea/**'
  workflow_dispatch:

concurrency:
  group: doctor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  health_audit:
    name: Project Health & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Project Doctor Audit
        id: run_doctor
        run: |
          set +e
          python3 scripts/doctor/project_doctor.py --ci --markdown > doctor-report.md
          EXIT_CODE=$?
          cat doctor-report.md >> $GITHUB_STEP_SUMMARY
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          set -e

      - name: Post PR Health Summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportContent = fs.readFileSync('doctor-report.md', 'utf8');
            const header = '<!-- retailos-doctor-report -->';
            const body = `${header}\n${reportContent}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => comment.body.includes(header));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Enforce Exit Code
        run: |
          if [ "${{ steps.run_doctor.outputs.exit_code }}" -ne "0" ]; then
            echo "::error::Project Doctor identified critical health or security regressions."
            exit 1
          fi
