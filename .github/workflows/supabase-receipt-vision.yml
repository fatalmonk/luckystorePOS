name: Supabase Receipt Vision

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'supabase/functions/extract-receipt-vision/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-receipt-vision.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Supabase GitHub environment to deploy to
        required: true
        type: choice
        options:
          - test
          - production

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check receipt vision function
        run: deno check supabase/functions/extract-receipt-vision/index.ts

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_TEST_PROJECT_REF: ${{ vars.SUPABASE_TEST_PROJECT_REF }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      DEPLOY_TARGET: ${{ inputs.target }}
    steps:
      # Always deploy reviewed code from main, even if dispatch is started from another ref.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Require target credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN secret for this environment.' >&2; exit 1; }
          case "$DEPLOY_TARGET" in
            test) project_ref="$SUPABASE_TEST_PROJECT_REF" ;;
            production) project_ref="$SUPABASE_PRODUCTION_PROJECT_REF" ;;
            *) echo 'Unsupported deployment target.' >&2; exit 1 ;;
          esac
          test -n "$project_ref" || { echo "Missing project-ref variable for the $DEPLOY_TARGET environment." >&2; exit 1; }
          echo "SUPABASE_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"
      - name: Require a configured vision provider secret
        shell: bash
        run: |
          set -o pipefail
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const hasSecret = name => new RegExp(`\\b${name}\\b`).test(input);
              const configured = ["OMNI_ROUTE_API_KEY", "OMNIROUTE_API_KEY", "OPENAI_API_KEY"].some(hasSecret);
              const corsConfigured = ["ALLOWED_ORIGINS", "ALLOWED_ORIGIN"].some(hasSecret);
              if (!configured) { console.error("No supported vision-provider secret is configured for this Supabase project."); process.exit(1); }
              if (!corsConfigured) { console.error("No browser-origin allow-list is configured for this Supabase project."); process.exit(1); }
              console.log("Vision-provider and browser-origin configuration are present.");
            });
          '
      - name: Deploy receipt vision function
        run: supabase functions deploy extract-receipt-vision --project-ref "$SUPABASE_PROJECT_REF"
