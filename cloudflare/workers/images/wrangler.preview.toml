name = "lucky-store-images-preview"
main = "src/index.ts"
compatibility_date = "2024-09-23"
account_id = "8e457654e12c3b75d2094bbd8914030b"
workers_dev = true

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "lucky-store-images-preview"

[[durable_objects.bindings]]
name = "TICKET_NONCES"
class_name = "UploadTicketNonce"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UploadTicketNonce"]

[vars]
ALLOWED_ORIGINS = "http://localhost:5187,http://127.0.0.1:5187"
PUBLIC_BASE_URL = "https://lucky-store-images-preview.luckystore-1947.workers.dev"

# Informational only: rate limits are enforced in worker code (src/index.ts)
[limits]
uploads_per_minute = 30
reads_per_minute = 600

[observability.logs]
enabled = true
invocation_logs = true
