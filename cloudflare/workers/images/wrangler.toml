name = "lucky-store-images"
main = "src/index.ts"
compatibility_date = "2024-09-23"
account_id = "8e457654e12c3b75d2094bbd8914030b"

workers_dev = true

[[routes]]
pattern = "images.luckystore1947.com"
custom_domain = true

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "lucky-store-images"
preview_bucket_name = "lucky-store-images"

[[durable_objects.bindings]]
name = "TICKET_NONCES"
class_name = "UploadTicketNonce"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UploadTicketNonce"]

[vars]
ALLOWED_ORIGINS = "https://luckystore1947.com,https://lucky-store-bd.vercel.app,https://admin.luckystore1947.com,https://lucky-store-pos-six.vercel.app,http://localhost:3000,http://localhost:5173"
PUBLIC_BASE_URL = "https://images.luckystore1947.com"
# UPLOAD_SIGNING_SECRET and INTERNAL_UPLOAD_SECRET must be encrypted secrets.

# Rate limiting: 30 uploads/min per IP, 600 reads/min per IP
[limits]
uploads_per_minute = 30
reads_per_minute = 600

[observability.logs]
enabled = true
invocation_logs = true
