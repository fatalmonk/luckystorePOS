[filters]
ignore_dirs = [
    ".git",
    "node_modules",
    ".next",
    "dist",
    "build",
    "out",
    ".vercel",
    ".wrangler",
    "coverage",
    "apps/admin_web/dist",
    "apps/customer_storefront/.next",
    "apps/mobile_app/build",
    "apps/scraper/build",
    "supabase/.temp",
    "supabase/functions/*/node_modules",
    "cloudflare/workers/*/node_modules",
    "**/ios/Pods",
    "**/android/.gradle",
    "**/.dart_tool",
    "**/__pycache__",
    "**/.venv",
    "**/.venv2",
    "**/.venv3",
]
ignore_files = [
    "*.lock",
    "package-lock.json",
    "yarn.lock",
    "pnpm-lock.yaml",
    "bun.lockb",
    "pubspec.lock",
    "Podfile.lock",
    "*.min.js",
    "*.min.css",
    "*.g.dart",
    "*.freezed.dart",
    "*.log",
    "*.tmp",
    ".env",
    ".env.local",
    ".env.*",
    "coverage/lcov.info",
    "migrations.json",
]

[hooks]
exclude_commands = [
    "playwright",
    "curl",
    "gh pr create",
    "gh issue create",
    "vercel --prod",
    # Build commands that produce huge output — route through specialized subcommands instead
    "npm run build",
    "npm run dev",
]

[display]
ultra_compact = true
max_width = 120

# Stricter per-command settings for Lucky Store
[command_overrides]
# rg: always use --count-matches for discovery; ultra-compact for targeted
rg = { default_args = "-u" }
find = { default_args = "-maxdepth 3 -type f" }
# git diff: prefer --name-only; full diff only when needed
git-diff = { default_args = "--name-only" }
git-diff-tree = { default_args = "--name-only --format=''" }
